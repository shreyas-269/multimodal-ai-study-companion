[project]
name = "study-companion-backend"
version = "0.1.0"
description = "Source-grounded AI study companion backend API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "firebase-admin",
    "pymupdf~=1.28.0",
    "fastembed>=0.8.1",
    "python-multipart>=0.0.32",
    "google-genai>=2.28.0",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
]
laptop = [
    "av>=16,<19",
    "faster-whisper>=1.2.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
