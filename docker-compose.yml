services:
  emulators:
    build:
      context: ./infra
      dockerfile: Dockerfile
    init: true
    stop_grace_period: 60s
    ports:
      - "4000:4000"
      - "8080:8080"
      - "9099:9099"
      - "9150:9150"
      - "9199:9199"
      - "4400:4400"
      - "4500:4500"
    volumes:
      - emulator_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:4000"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  emulator_data:
